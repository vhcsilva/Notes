name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'cadernolivre' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CadernoLivre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CadernoLivre-apk
          path: CadernoLivre.apk

      - name: Publicar em Releases (download direto pelo celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" CadernoLivre.apk \
            --title "Caderno Livre $TAG" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo CadernoLivre.apk abaixo e instale no Android." \
            --latest
